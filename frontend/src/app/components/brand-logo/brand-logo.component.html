<a routerLink="/" class="brand-link" title="Aligned Creation Engine - Home">
  <div class="logo-mark" [style.width.px]="size" [style.height.px]="size">
    <svg 
      viewBox="0 0 100 100" 
      class="logo-svg"
      xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="conduitStreamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#b388ff" />
          <stop offset="35%" stop-color="#00e5ff" />
          <stop offset="70%" stop-color="#ffd600" />
          <stop offset="100%" stop-color="#ff1744" />
        </linearGradient>

        <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Outer Harmonic Orbit -->
      <circle 
        cx="50" 
        cy="50" 
        r="44" 
        class="orbit-ring" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.15)" 
        stroke-width="1.5" 
        stroke-dasharray="4 3" 
      />

      <!-- Downward Current Triangle (The Descent of Manifestation) -->
      <polygon 
        points="50,88 20,34 80,34" 
        class="triangle-down"
        fill="none" 
        stroke="url(#conduitStreamGradient)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#logoGlow)"
      />

      <!-- Upward Grounding Triangle (The Physical Foundation) -->
      <polygon 
        points="50,12 80,66 20,66" 
        class="triangle-up"
        fill="none" 
        stroke="rgba(255, 214, 0, 0.35)" 
        stroke-width="1.5" 
        stroke-linejoin="round"
      />

      <!-- Central Vertical Conduit Axis -->
      <line 
        x1="50" 
        y1="10" 
        x2="50" 
        y2="90" 
        class="conduit-axis"
        stroke="url(#conduitStreamGradient)" 
        stroke-width="1.5" 
        stroke-linecap="round"
        stroke-dasharray="2 3"
      />

      <!-- Radiant Singularity Core -->
      <circle 
        cx="50" 
        cy="50" 
        r="5" 
        class="center-singularity" 
        fill="#ffd600" 
        filter="url(#logoGlow)"
      />
    </svg>
  </div>

  @if (showText) {
    <div class="brand-text">
      <span class="brand-title">ALIGNED CREATION ENGINE</span>
      <span class="brand-subtitle">From Inspiration to Manifestation</span>
    </div>
  }
</a>
