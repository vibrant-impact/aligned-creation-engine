<div 
  class="modal-overlay" 
  [class.hidden]="!isOpen" 
  [attr.aria-hidden]="!isOpen"
  (click)="onBackdropClick($event)">
  <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h3 id="modalTitle">Ignite New Intent</h3>
      <button class="btn-close" type="button" aria-label="Close modal" (click)="handleClose()">&times;</button>
    </div>

    <form class="modal-form" (ngSubmit)="handleSubmit()">
      <div class="form-group">
        <label for="goalTitle">Intention Name / Vision Anchor</label>
        <input 
          type="text" 
          id="goalTitle" 
          name="goalTitle" 
          [(ngModel)]="goalTitle" 
          placeholder="e.g., Launch Creative Studio, Run First Marathon" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="goalCategory">Life Domain / Category</label>
        <select id="goalCategory" name="goalCategory" [(ngModel)]="goalCategory" required>
          <option value="" disabled selected>Select a domain...</option>
          <option value="Career & Business">Career & Business</option>
          <option value="Creative Expression">Creative Expression</option>
          <option value="Vitality & Body">Vitality & Body</option>
          <option value="Spiritual & Mindset">Spiritual & Mindset</option>
          <option value="Relationships & Community">Relationships & Community</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="handleClose()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Igniting...' : 'Ignite Journey' }}
        </button>
      </div>
    </form>
  </div>
</div>
