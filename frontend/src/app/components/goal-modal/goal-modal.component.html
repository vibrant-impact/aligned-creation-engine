  <!-- Add New Goal / Intent Modal -->
  <div id="goalModalOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">Ignite New Intent</h3>
        <button id="closeModalBtn" class="btn-close" aria-label="Close modal">&times;</button>
      </div>

      <form id="newGoalForm" class="modal-form">
        <div class="form-group">
          <label for="goalTitle">Intention Name / Vision Anchor</label>
          <input type="text" id="goalTitle" name="goalTitle"
            placeholder="e.g., Launch Creative Studio, Run First Marathon" required autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="goalCategory">Life Domain / Category</label>
          <select id="goalCategory" name="goalCategory" required>
            <option value="" disabled selected>Select a domain...</option>
            <option value="Career & Business">Career & Business</option>
            <option value="Creative Expression">Creative Expression</option>
            <option value="Vitality & Body">Vitality & Body</option>
            <option value="Spiritual & Mindset">Spiritual & Mindset</option>
            <option value="Relationships & Community">Relationships & Community</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelGoalBtn" class="btn-secondary">Cancel</button>
          <button type="submit" id="submitGoalBtn" class="btn-primary">Ignite Journey</button>
        </div>
      </form>
    </div>
  </div>
